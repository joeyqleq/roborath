[project]
name = "roborath"
version = "0.1.0"
description = "Unprivileged Twitch IRC -> Mattermost AI bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=14,<17", "httpx>=0.27,<1", "ddgs>=9,<11"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/roborath"]
