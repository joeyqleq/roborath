name: RoboRath offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        python: ['3.13', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install project dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint correctness
        run: ruff check src tests --select E9,F63,F7,F82
      - name: Verify syntax
        run: python -m compileall -q src/roborath
      - name: Run SQLite unit tests
        run: PYTHONPATH=src/roborath python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bridge regression checks
        run: |
          PYTHONPATH=src/roborath python tests/test_bridge.py
          PYTHONPATH=src/roborath python tests/test_irc_adapter.py
